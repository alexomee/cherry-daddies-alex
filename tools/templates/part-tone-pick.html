<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выбор звука</title>
<!-- Tone choice page for a written-out part (wiki/pipelines/part-transcription-guide.md): per voice the
     original bars, a reference and the best GM-800 takes of a sweep, looped, same loudness.
     Filled by a song's prep script: META = {title, sub, groups: [{name, note, clips: [[file, name, note, isRef]]}]}.
     One clip plays at a time; inside a group switching keeps the position. Audio is played from blobs
     (python3 -m http.server has no Range support). -->
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #1c1b19; --mute: #6b6862; --line: #e2dfd8;
    --accent: #b3261e; --accent-ink: #ffffff; --on: #fbe9e7; --ref: #1f5f8b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --card: #211f1c; --ink: #efece6; --mute: #a09c94; --line: #36332e;
            --accent: #ef6a5e; --accent-ink: #1a0907; --on: #3a1f1c; --ref: #7fbfe8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 110px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--mute); margin: 0 0 20px; }
  h2 { font-size: 17px; margin: 30px 0 2px; }
  .gn { color: var(--mute); font-size: 14px; margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  button { font: inherit; color: var(--ink); cursor: pointer; }
  button.t { text-align: left; width: 100%; background: var(--card); border: 1px solid var(--line);
             border-radius: 10px; padding: 10px 12px; }
  button.t:hover { border-color: var(--mute); }
  button.t.on { background: var(--on); border-color: var(--accent); }
  button.t b { display: block; font-weight: 600; }
  button.t small { display: block; color: var(--mute); font-size: 13px; font-variant-numeric: tabular-nums; }
  button.t.ref b { color: var(--ref); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); }
  .bar > div { max-width: 900px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; }
  #pp { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent);
        color: var(--accent-ink); font-size: 18px; }
  #now { flex: 1; min-width: 0; }
  #now b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #prog { width: 100%; height: 8px; background: var(--line); border-radius: 4px; margin-top: 6px; position: relative; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); border-radius: 4px; }
  kbd { font: 12px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<main>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <div id="groups"></div>
</main>
<div class="bar"><div>
  <button id="pp" aria-label="Играть / пауза">▶</button>
  <div id="now"><b id="title">Загрузка…</b><div id="prog"><div id="fill"></div></div></div>
</div></div>
<script>
const M = /*META*/;
const $ = id => document.getElementById(id);
document.title = M.title; $("h1").textContent = M.title; $("sub").innerHTML = M.sub;
let cur = null, playing = false, ready = false;
const all = [];
M.groups.forEach((g, gi) => {
  const h = document.createElement("h2"); h.textContent = g.name; $("groups").appendChild(h);
  const p = document.createElement("p"); p.className = "gn"; p.innerHTML = g.note; $("groups").appendChild(p);
  const grid = document.createElement("div"); grid.className = "grid"; $("groups").appendChild(grid);
  g.clips.forEach(([file, name, note, ref]) => {
    const b = document.createElement("button"); b.className = "t" + (ref ? " ref" : "");
    b.innerHTML = `<b>${name}</b><small>${note}</small>`; grid.appendChild(b);
    const it = { file, name, gi, gname: g.name, b, a: null }; b.onclick = () => pick(it); all.push(it);
  });
});
Promise.all(all.map(async it => {
  const blob = await (await fetch(encodeURIComponent(it.file))).blob();
  it.a = new Audio(URL.createObjectURL(blob)); it.a.loop = true;
})).then(() => { ready = true; $("title").textContent = "Выбери звук"; }, e => { $("title").textContent = "Не загрузилось: " + e; });
function pick(it) {
  if (!ready) return;
  const t = cur && cur.gi === it.gi ? cur.a.currentTime : 0;      // same voice: keep the place in the loop
  if (cur) { cur.a.pause(); cur.b.classList.remove("on"); }
  cur = it; it.b.classList.add("on"); it.a.currentTime = t; it.a.play().catch(() => {});
  playing = true; $("pp").textContent = "❚❚"; $("title").textContent = it.gname + " — " + it.name;
}
function toggle() {
  if (!ready || !cur) return;
  if (playing) cur.a.pause(); else cur.a.play().catch(() => {});
  playing = !playing; $("pp").textContent = playing ? "❚❚" : "▶";
}
$("pp").onclick = toggle;
setInterval(() => { if (cur && cur.a.duration) $("fill").style.width = (cur.a.currentTime / cur.a.duration * 100) + "%"; }, 60);
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.code === "Space") { e.preventDefault(); return toggle(); }
  if (!cur) return;
  const g = all.filter(i => i.gi === cur.gi), k = g.indexOf(cur);
  if (e.code === "ArrowRight") { e.preventDefault(); pick(g[(k + 1) % g.length]); }
  if (e.code === "ArrowLeft") { e.preventDefault(); pick(g[(k + g.length - 1) % g.length]); }
});
</script>
</body>
</html>
