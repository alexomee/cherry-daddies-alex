<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cherry Daddies — сетлист / статус</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#16181f; --row2:#171a22; --txt:#e8eaf0; --dim:#9aa0b0;
    --line:#262a36; --set1:#3a6df0; --set2:#e0457b; --bis:#f0a93a;
    --ok:#3ad29f; --no:#ff5d6c; --accent:#6c8cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1320px;margin:0 auto;padding:28px 18px 80px}
  .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:22px;margin:0 0 4px;letter-spacing:.3px}
  .sync{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:2px 10px}
  .sync.on{color:var(--ok)} .sync.off{color:var(--no);border-color:#5a2630}
  .summary{color:var(--dim);font-size:13px;margin:0 0 6px}
  .saved-note{color:#5b6172;font-size:11.5px;margin:0 0 22px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 26px}
  .panel h2{margin:0 0 12px;font-size:16px}
  .todo-add{display:flex;gap:8px;margin-bottom:10px}
  .todo-add input{flex:1;background:#0e1016;border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:9px 11px;font-size:14px}
  .todo-add input:focus{outline:none;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:18px;cursor:pointer;line-height:1}
  .btn:hover{filter:brightness(1.1)}
  .todolist{list-style:none;margin:0;padding:0}
  .todolist li{display:flex;align-items:flex-start;gap:9px;padding:5px 0;border-bottom:1px solid #20232e}
  .todolist li:last-child{border-bottom:none}
  .todolist input[type=checkbox]{margin-top:3px;width:16px;height:16px;accent-color:var(--ok);cursor:pointer;flex:none}
  .todolist .t{flex:1;word-break:break-word}
  .todolist li.done .t{text-decoration:line-through;color:#646b7d}
  .todolist .del{background:none;border:none;color:#5b6172;cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
  .todolist .del:hover{color:var(--no)}
  .empty{color:#565c6c;font-size:13px;font-style:italic}
  table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:12px;overflow:hidden}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);
    text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);background:#13151c;white-space:nowrap}
  td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  tbody tr:nth-child(even) td{background:var(--row2)}
  tr.sec td{background:transparent !important;padding:22px 12px 8px}
  tr.sec .setname{font-weight:700;font-size:15px;padding:3px 12px;border-radius:7px;color:#fff}
  tr.set1 .setname{background:var(--set1)} tr.set2 .setname{background:var(--set2)}
  tr.bis .setname{background:var(--bis);color:#1a1300}
  tr.sec .sub{color:var(--dim);font-size:13px;margin-left:8px}
  .num{color:var(--dim);width:30px;text-align:right;font-variant-numeric:tabular-nums}
  .song{min-width:160px}.title{font-weight:600}.artist{color:var(--dim);font-size:12.5px}
  .c-cues,.c-bass,.c-other,.c-info{font-size:13px}
  .ready{color:var(--txt)} .notready{color:var(--no)}
  .ok{color:var(--ok)} .no{color:var(--no)} .dash{color:#555}
  tr.nodata .c-info{color:var(--no);font-size:12.5px;font-style:italic;background:#241419 !important}
  .chip{display:inline-block;background:#222838;color:#c7d0e6;border:1px solid #303a52;
    border-radius:6px;padding:1px 7px;margin:2px 4px 2px 0;font-size:11.5px;white-space:nowrap}
  .c-bass{width:112px;max-width:112px;white-space:normal}
  .c-other{width:152px;max-width:152px}
  .c-mix{width:330px}
  .player{display:flex;align-items:center;gap:8px;margin:5px 0}
  .mix-lbl{font-size:11px;width:40px;flex:none;font-weight:600;color:var(--dim)}
  .mix-lbl.alex{color:#ff9ecb} .mix-lbl.roma{color:#9cc0ff}
  .mix-lbl.steve{color:#f0a93a} .mix-lbl.tanya{color:#7fe8c6} .mix-lbl.all{color:#cdd3e0}
  .mixhead{vertical-align:middle}
  .mixsel{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .mixsel-lbl{font-size:11px;color:var(--dim);margin-right:2px;text-transform:none}
  .psel{border:1px solid var(--line);background:#13151c;color:var(--dim);border-radius:6px;
    padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0}
  .psel:hover{border-color:var(--accent)}
  .psel.all.active{background:#2e3340;border-color:#cdd3e0;color:#fff}
  .psel.alex.active{background:#7a3357;border-color:#ff9ecb;color:#ffd9ea}
  .psel.steve.active{background:#6b4a1a;border-color:#f0a93a;color:#ffe2b0}
  .psel.roma.active{background:#23304f;border-color:#9cc0ff;color:#d4e4ff}
  .psel.tanya.active{background:#1f4038;border-color:#7fe8c6;color:#c4f5e6}
  .pbtn{flex:none;width:28px;height:28px;border-radius:50%;border:none;background:var(--accent);
    color:#fff;cursor:pointer;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
  .pbtn:hover{filter:brightness(1.1)}
  .seek{flex:1;min-width:110px;height:5px;-webkit-appearance:none;appearance:none;
    background:#2a2f3d;border-radius:3px;cursor:pointer}
  .seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;
    border-radius:50%;background:var(--accent);cursor:pointer}
  .seek::-moz-range-thumb{width:14px;height:14px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}
  .time{flex:none;font-size:11px;color:var(--dim);width:32px;text-align:right;font-variant-numeric:tabular-nums}
  .who{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12.5px;font-weight:600;white-space:normal}
  .who-roma{background:#23304f;color:#9cc0ff}
  .who-roma-g{background:#1f4038;color:#7fe8c6}
  .who-alex{background:#43213a;color:#ff9ecb}
  .c-todo{min-width:185px} .c-notes{min-width:200px}
  .c-todo .todolist li{padding:3px 0;font-size:13px}
  .c-todo .todo-add{margin-bottom:6px}
  .c-todo .todo-add input{padding:6px 8px;font-size:12.5px}
  .c-todo .btn{padding:0 9px;font-size:15px}
  .notes-area{width:100%;min-height:42px;background:#0e1016;border:1px solid var(--line);
    color:var(--txt);border-radius:8px;padding:7px 9px;font:13px/1.4 inherit;resize:vertical}
  .notes-area:focus{outline:none;border-color:var(--accent)}
  .notes-area::placeholder{color:#4a5060}
  .loading{color:var(--dim);padding:30px 4px}
  /* hosted (non-localhost): hide private notes/todos, keep board + player */
  body.hosted #gpanel, body.hosted .saved-note, body.hosted #sync,
  body.hosted .c-todo, body.hosted .c-notes, body.hosted .h-todo, body.hosted .h-notes{display:none}
  @media(max-width:820px){
    .wrap{padding:18px 10px 60px}.artist{font-size:11.5px}
    td,th{padding:8px 7px}.song{min-width:110px}
    table{display:block;overflow-x:auto}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🍒 Cherry Daddies — сетлист / статус плейбека</h1>
    <span class="sync" id="sync">…</span>
  </div>
  <p class="summary" id="summary"></p>
  <p class="saved-note">✏️ Todo и заметки правятся прямо здесь и сохраняются на сервере (общие для всех). Если сервер недоступен — пишутся локально и синхронизируются позже.</p>

  <div class="panel" id="gpanel">
    <h2>📋 Общий todo</h2>
    <div class="todo-add">
      <input id="gAdd" placeholder="Новая задача… (Enter)">
      <button class="btn" id="gAddBtn" title="Добавить">+</button>
    </div>
    <ul class="todolist" id="gList"></ul>
  </div>

  <table>
    <thead><tr>
      <th class="num">#</th><th>Песня</th>
      <th class="mixhead"><div class="mixsel" id="mixsel">
        <span class="mixsel-lbl">Mix:</span>
        <button class="psel all" data-p="all" title="full mix + click + cues">All</button>
        <button class="psel alex" data-p="alex">Alex</button>
        <button class="psel steve" data-p="steve" title="drums">Steve</button>
        <button class="psel roma" data-p="roma">Roma</button>
        <button class="psel tanya" data-p="tanya" title="vocal">Tanya</button>
      </div></th>
      <th>bass</th><th>pb-other (stems)</th><th class="h-todo">Todo</th><th class="h-notes">Заметки</th>
    </tr></thead>
    <tbody id="tbody"><tr><td class="loading" colspan="7">загрузка…</td></tr></tbody>
  </table>
</div>

<script>
(function(){
  "use strict";
  var API = "/api/state", LS = "cd-dashboard-v1";
  var state = { global: [], songs: {} };
  var online = false;
  var SONGS = {};                 // sid -> song (reference data from songs.json)
  var MIXLS = "cd-mixplayer";
  var currentPlayer = "all";
  try { var _mp = localStorage.getItem(MIXLS); if(_mp) currentPlayer = _mp; } catch(e){}
  // localhost = full tool (local audio + notes/todos); hosted = static board (R2 audio, no notes)
  var LOCAL = ["localhost","127.0.0.1","[::1]",""].indexOf(location.hostname) >= 0 || location.protocol === "file:";
  var R2_BASE = "https://releases.agentiqa.com/cherry-dash";
  function audioSrc(s, player){
    if(LOCAL) return "audio?sid=" + encodeURIComponent(s.sid) + "&p=" + player;
    var file = player === "all" ? "all.mp3" : "practice-" + player + ".mp3";
    return R2_BASE + "/" + s.slug + "/" + file;
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function normalize(s){ s = s || {}; return {
    global: Array.isArray(s.global) ? s.global : [],
    songs: (s.songs && typeof s.songs === "object" && !Array.isArray(s.songs)) ? s.songs : {} }; }
  function uid(){ return "i" + Math.random().toString(36).slice(2,9) + Date.now().toString(36); }
  function songRec(sid){ if(!state.songs[sid]) state.songs[sid] = {notes:"", todos:[]}; return state.songs[sid]; }

  var syncEl = document.getElementById("sync");
  function setSync(kind, text){ syncEl.className = "sync " + kind; syncEl.textContent = text; }

  // ---- persistence: server primary, localStorage fallback + offline cache ----
  function cacheLocal(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
  async function loadState(){
    try{
      var r = await fetch(API, {cache:"no-store"});
      if(!r.ok) throw new Error("http "+r.status);
      state = normalize(await r.json());
      online = true; cacheLocal(); setSync("on","● синхронизировано");
    }catch(e){
      online = false;
      try{ state = normalize(JSON.parse(localStorage.getItem(LS))); }catch(_){ state = {global:[],songs:{}}; }
      setSync("off","● оффлайн (локально)");
    }
  }
  var saveT;
  function save(){
    cacheLocal();
    clearTimeout(saveT);
    saveT = setTimeout(async function(){
      try{
        var r = await fetch(API, {method:"PUT", headers:{"content-type":"application/json"}, body:JSON.stringify(state)});
        if(!r.ok) throw new Error("http "+r.status);
        online = true; setSync("on","● сохранено");
      }catch(e){ online = false; setSync("off","● оффлайн (локально)"); }
    }, 300);
  }

  // ---- generic checklist ----
  function renderList(ul, arr, onChange){
    ul.textContent = "";
    if(!arr.length){
      var li = document.createElement("li"); li.className = "empty-li";
      var em = document.createElement("span"); em.className = "empty"; em.textContent = "пусто";
      li.appendChild(em); ul.appendChild(li); return;
    }
    arr.forEach(function(item){
      var li = document.createElement("li"); if(item.done) li.className = "done";
      var cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!item.done;
      cb.addEventListener("change", function(){ item.done = cb.checked; onChange(); });
      var t = document.createElement("span"); t.className = "t"; t.textContent = item.text;
      t.title = "Клик — редактировать";
      function remove(){ var i = arr.indexOf(item); if(i>-1) arr.splice(i,1); onChange(); }
      t.addEventListener("click", function(){
        var nv = prompt("Изменить:", item.text);
        if(nv !== null){ var v = nv.trim(); if(v){ item.text = v; onChange(); } else remove(); }
      });
      var del = document.createElement("button"); del.className = "del"; del.textContent = "×"; del.title = "Удалить";
      del.addEventListener("click", remove);
      li.appendChild(cb); li.appendChild(t); li.appendChild(del); ul.appendChild(li);
    });
  }

  // ---- read-only cell renderers (data from songs.json) ----
  function whoClass(w){ return {"Roma":"who who-roma","Roma (real bass-guitar)":"who who-roma-g","Alex":"who who-alex"}[w] || "who"; }
  function bassCell(b){
    if(!b || b.kind==="none") return '<span class="dash">—</span>';
    if(b.kind==="playback") return '<span class="ok">▶︎</span> playback ('+esc(b.label)+')';
    if(b.kind==="assign") return '<span class="'+whoClass(b.who)+'">'+esc(b.who)+'</span>';
    return '<span class="dash">—</span>';
  }
  function otherCell(o){
    if(!o || o.kind==="none") return '<span class="dash">—</span>';
    if(o.kind==="layers") return '<span class="ok">🎹</span> layer: '+esc(o.items.join(", "));
    if(o.kind==="stems") return o.items.map(function(x){ return '<span class="chip">'+esc(x)+'</span>'; }).join("");
    return '<span class="dash">—</span>';
  }
  // mix cell for the currently selected player (one player per row)
  function mixCellFor(s, player){
    if(!s.hasData || !s.practice || s.practice.indexOf(player) < 0) return '<span class="dash">—</span>';
    var lbl = player.charAt(0).toUpperCase() + player.slice(1);
    var src = audioSrc(s, player);
    return '<div class="player">'
         + '<span class="mix-lbl '+player+'">'+lbl+'</span>'
         + '<button class="pbtn" aria-label="play/pause">▶</button>'
         + '<input class="seek" type="range" min="0" max="100" value="0" step="0.1">'
         + '<span class="time">0:00</span>'
         + '<audio class="mixaudio" preload="metadata" src="'+src+'"></audio>'
         + '</div>';
  }

  function fmtTime(t){ if(!isFinite(t) || t < 0) t = 0; t = Math.floor(t);
    return Math.floor(t/60) + ":" + ("0" + (t%60)).slice(-2); }

  // wire every visible practice player (seek thumb + only one plays at a time)
  function wirePlayers(){
    var allAudio = document.querySelectorAll(".mixaudio");
    function pauseOthers(cur){ allAudio.forEach(function(o){ if(o !== cur) o.pause(); }); }
    document.querySelectorAll(".player").forEach(function(pl){
      var audio = pl.querySelector(".mixaudio"), btn = pl.querySelector(".pbtn"),
          seek = pl.querySelector(".seek"), time = pl.querySelector(".time"), scrubbing = false;
      audio.addEventListener("loadedmetadata", function(){ seek.max = audio.duration || 0; time.textContent = fmtTime(audio.duration); });
      audio.addEventListener("timeupdate", function(){ if(!scrubbing){ seek.value = audio.currentTime; time.textContent = fmtTime(audio.currentTime); } });
      audio.addEventListener("play", function(){ btn.textContent = "⏸"; pauseOthers(audio); });
      audio.addEventListener("pause", function(){ btn.textContent = "▶"; });
      audio.addEventListener("ended", function(){ btn.textContent = "▶"; seek.value = 0; time.textContent = fmtTime(audio.duration); });
      btn.addEventListener("click", function(){ if(audio.paused) audio.play(); else audio.pause(); });
      seek.addEventListener("input", function(){ scrubbing = true; time.textContent = fmtTime(parseFloat(seek.value)); });
      seek.addEventListener("change", function(){ audio.currentTime = parseFloat(seek.value); scrubbing = false; });
    });
  }

  // re-render the Mix column for the selected player
  function updateMixColumn(){
    document.querySelectorAll(".mixaudio").forEach(function(a){ a.pause(); });
    document.querySelectorAll("#mixsel .psel").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-p") === currentPlayer); });
    document.querySelectorAll("tr[data-song] td.c-mix").forEach(function(td){
      var sid = td.parentNode.getAttribute("data-song"), s = SONGS[sid];
      td.innerHTML = s ? mixCellFor(s, currentPlayer) : '<span class="dash">—</span>';
    });
    wirePlayers();
  }

  function setupMixSelector(){
    document.querySelectorAll("#mixsel .psel").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-p") === currentPlayer);
      b.addEventListener("click", function(){
        currentPlayer = b.getAttribute("data-p");
        try { localStorage.setItem(MIXLS, currentPlayer); } catch(e){}
        updateMixColumn();
      });
    });
  }

  function renderTable(data){
    var html = "";
    data.sets.forEach(function(st){
      var sub = st.subtitle ? ' <span class="sub">'+esc(st.subtitle)+'</span>' : "";
      html += '<tr class="sec '+esc(st.cls)+'"><td colspan="7"><span class="setname">'+esc(st.name)+'</span>'+sub+'</td></tr>';
      st.songs.forEach(function(s, idx){
        SONGS[s.sid] = s;
        var sid = esc(s.sid), n = idx+1;
        var songCell = '<div class="title">'+esc(s.title)+'</div><div class="artist">'+esc(s.artist)+'</div>';
        var edit = '<td class="c-todo" data-song="'+sid+'"></td><td class="c-notes" data-song="'+sid+'"></td>';
        if(!s.hasData){
          html += '<tr class="nodata" data-song="'+sid+'"><td class="num">'+n+'</td><td class="song">'+songCell+'</td>'
                + '<td class="c-mix">'+mixCellFor(s, currentPlayer)+'</td>'
                + '<td class="c-info" colspan="2">нет данных (папка/mix.json отсутствует)</td>'+edit+'</tr>';
          return;
        }
        html += '<tr data-song="'+sid+'"><td class="num">'+n+'</td><td class="song">'+songCell+'</td>'
              + '<td class="c-mix">'+mixCellFor(s, currentPlayer)+'</td>'
              + '<td class="c-bass">'+bassCell(s.bass)+'</td>'
              + '<td class="c-other">'+otherCell(s.other)+'</td>'+edit+'</tr>';
      });
    });
    document.getElementById("tbody").innerHTML = html;
    wirePlayers();

    if(data.counts){
      var c = data.counts;
      document.getElementById("summary").innerHTML =
        c.data+"/"+c.total+" с данными &nbsp;·&nbsp; "+c.cues+" cues готовы &nbsp;·&nbsp; "+
        c.playback+" bass из playback &nbsp;·&nbsp; "+c.other+" с pb-other &nbsp;·&nbsp; "+
        (c.practice||0)+" с практис-миксом";
    }
  }

  // ---- hydrate editable cells from state ----
  function hydrate(){
    var gList = document.getElementById("gList"), gAdd = document.getElementById("gAdd");
    function renderGlobal(){ renderList(gList, state.global, function(){ renderGlobal(); save(); }); }
    function addGlobal(){ var v = gAdd.value.trim(); if(!v) return;
      state.global.push({id:uid(), text:v, done:false}); gAdd.value=""; renderGlobal(); save(); }
    document.getElementById("gAddBtn").onclick = addGlobal;
    gAdd.onkeydown = function(e){ if(e.key==="Enter") addGlobal(); };
    renderGlobal();

    document.querySelectorAll(".c-todo[data-song]").forEach(function(td){
      var rec = songRec(td.getAttribute("data-song"));
      var wrap = document.createElement("div"); wrap.className = "todo-add";
      var inp = document.createElement("input"); inp.placeholder = "+ задача";
      var b = document.createElement("button"); b.className = "btn"; b.textContent = "+";
      var ul = document.createElement("ul"); ul.className = "todolist";
      function rerender(){ renderList(ul, rec.todos, function(){ rerender(); save(); }); }
      function add(){ var v = inp.value.trim(); if(!v) return;
        rec.todos.push({id:uid(), text:v, done:false}); inp.value=""; rerender(); save(); }
      b.onclick = add; inp.onkeydown = function(e){ if(e.key==="Enter") add(); };
      wrap.appendChild(inp); wrap.appendChild(b); td.appendChild(wrap); td.appendChild(ul); rerender();
    });

    document.querySelectorAll(".c-notes[data-song]").forEach(function(td){
      var rec = songRec(td.getAttribute("data-song"));
      var ta = document.createElement("textarea");
      ta.className = "notes-area"; ta.placeholder = "заметки…"; ta.value = rec.notes || "";
      ta.addEventListener("input", function(){ rec.notes = ta.value; save(); });
      td.appendChild(ta);
    });
  }

  // ---- boot ----
  (async function(){
    document.body.classList.toggle("hosted", !LOCAL);
    var dataP = fetch("songs.json", {cache:"no-store"}).then(function(r){ return r.json(); });
    if(LOCAL) await loadState();            // notes/todos backend — localhost only
    var data;
    try{ data = await dataP; }
    catch(e){ document.getElementById("tbody").innerHTML =
      '<tr><td class="loading no" colspan="7">не удалось загрузить songs.json</td></tr>'; return; }
    renderTable(data);
    setupMixSelector();
    if(LOCAL) hydrate();                     // wire global todo + per-song notes/todos
  })();
})();
</script>
</body>
</html>
