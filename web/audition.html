<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<title>pb audition · 12.12</title>
<link rel="icon" href="favicon.svg">
<style>
  :root{
    --bg:#0e0f13; --panel:#16181f; --row:#171a22; --txt:#e8eaf0; --dim:#9aa0b0;
    --line:#262a36; --accent:#6c8cff; --ok:#3ad29f; --no:#ff5d6c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(190px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:20px;margin:0}
  header a{color:var(--dim);font-size:13px;text-decoration:none;margin-left:auto}
  .sub{color:var(--dim);font-size:13px;margin:0 0 14px}
  ol{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  li{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--panel);
    border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
  li:first-child{border-top:0}
  li:hover{background:var(--row)}
  li .n{width:24px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
  li .t{flex:1;min-width:0}
  li .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  li .t span{color:var(--dim);font-size:13px}
  li .d{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
  li.cur{background:#1b2133}
  li.cur .n{color:var(--accent)}
  li.cur b{color:var(--accent)}
  li.bad .t b{color:var(--no)}
  .player{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .player .in{max-width:720px;margin:0 auto}
  .now{display:flex;align-items:baseline;gap:8px;min-height:22px}
  .now b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .now span{color:var(--dim);font-size:13px;white-space:nowrap}
  .seek{display:flex;align-items:center;gap:10px;margin:8px 0 6px;font-size:12px;color:var(--dim);
    font-variant-numeric:tabular-nums}
  .seek input{flex:1;accent-color:var(--accent);margin:0}
  .ctl{display:flex;align-items:center;justify-content:center;gap:18px}
  .ctl button{background:none;border:1px solid var(--line);color:var(--txt);border-radius:50%;
    width:48px;height:48px;font-size:18px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .ctl button.main{width:62px;height:62px;font-size:24px;background:var(--accent);border-color:var(--accent);color:#fff}
  .ctl button:disabled{opacity:.4}
  .upd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px}
  .upd h2{font-size:14px;margin:0 0 8px;font-weight:600}
  .upd h2 span{color:var(--dim);font-weight:400}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:#0e1016;border:1px solid var(--line);color:var(--txt);border-radius:16px;padding:4px 10px;
    font-size:13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .chip:hover{border-color:var(--accent)}
  .chip i{font-style:normal;color:var(--ok);font-size:11px;margin-left:5px}
  .arch-link{display:inline-block;margin-top:10px;background:none;border:0;padding:0;color:var(--accent);
    font-size:13px;cursor:pointer}
  .arch{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
  .arch[hidden]{display:none}
  .arch details{padding:6px 0;border-bottom:1px solid var(--line)}
  .arch details:last-child{border-bottom:0}
  .arch summary{cursor:pointer;font-size:14px;list-style-position:inside}
  .arch summary span{color:var(--dim);font-size:13px}
  .arch .chips{margin:8px 0 4px}
  li .u{color:var(--ok);font-size:11px;border:1px solid #234a3c;border-radius:10px;padding:1px 6px;white-space:nowrap}
  .msg{color:var(--no);font-size:13px;text-align:center;margin-top:6px;min-height:0}
  .msg:empty{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>▶ pb audition · 12.12 all</h1>
    <a href="./">← сетлист</a>
  </header>
  <p class="sub" id="sub">загрузка…</p>
  <section class="upd" id="upd" hidden></section>
  <ol id="list"></ol>
</div>

<div class="player">
  <div class="in">
    <div class="now"><b id="nowTitle">—</b><span id="nowArtist"></span></div>
    <div class="seek"><span id="cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
    <div class="ctl">
      <button id="prev" type="button" aria-label="предыдущая">⏮</button>
      <button id="play" class="main" type="button" aria-label="играть">▶</button>
      <button id="next" type="button" aria-label="следующая">⏭</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<audio id="a" preload="auto" playsinline></audio>

<script>
// One plain <audio> element for the whole set: on iPhone it keeps playing with the screen locked
// (Web Audio gets suspended). The next song is loaded into the SAME element from its "ended" handler,
// so the audio session never stops and the playlist runs on with the phone locked.
(function(){
  var SET = "12.12 all";
  var LOCAL = ["localhost","127.0.0.1","[::1]",""].indexOf(location.hostname) >= 0 || location.protocol === "file:";
  var R2 = "https://releases.agentiqa.com/cherry-dash";
  var KEY = "pb-audition-1212";
  var a = document.getElementById("a");
  var list = document.getElementById("list");
  var seek = document.getElementById("seek");
  var playBtn = document.getElementById("play");
  var msg = document.getElementById("msg");
  var songs = [], idx = -1, dragging = false, durs = {}, fresh = {};

  // «последнее обновление» + archive by date, from web/audition-updates.json (tools/audition_updates.py)
  function dayName(d){
    var t = new Date(d + "T12:00:00");
    return isNaN(t) ? d : t.toLocaleDateString("ru-RU", {day: "numeric", month: "long", weekday: "short"});
  }
  function shortDay(d){ var p = d.split("-"); return p.length === 3 ? p[2] + "." + p[1] : d; }
  function plural(n){ var m = n % 10, h = n % 100;
    return n + (m === 1 && h !== 11 ? " песня" : m >= 2 && m <= 4 && (h < 12 || h > 14) ? " песни" : " песен"); }
  function chips(list_){
    return '<div class="chips">' + list_.map(function(x){
      return '<button class="chip" type="button" data-slug="' + esc(x.slug) + '">' + esc(x.title || x.sid || "")
        + (x["new"] ? '<i>новая</i>' : "") + '</button>';
    }).join("") + '</div>';
  }
  function showUpdates(u){
    var box = document.getElementById("upd");
    var ups = (u && u.updates || []).map(function(d){
      return {date: d.date, songs: d.songs.filter(function(x){ return bySlug[x.slug] !== undefined; })};
    }).filter(function(d){ return d.songs.length; });
    if(!ups.length) return;
    var last = ups[0], older = ups.slice(1);
    last.songs.forEach(function(x){ fresh[x.slug] = "↻ " + shortDay(last.date); });
    var h = '<h2>Последнее обновление · ' + esc(dayName(last.date)) + ' <span>· ' + plural(last.songs.length) + '</span></h2>'
          + chips(last.songs);
    if(older.length){
      h += '<button class="arch-link" type="button" id="archBtn">архив обновлений (' + older.length + ') ▾</button>'
         + '<div class="arch" id="arch" hidden>' + older.map(function(d){
             return '<details><summary>' + esc(dayName(d.date)) + ' <span>· ' + plural(d.songs.length) + '</span></summary>'
               + chips(d.songs) + '</details>';
           }).join("") + '</div>';
    }
    box.innerHTML = h; box.hidden = false;
    var btn = document.getElementById("archBtn");
    if(btn) btn.addEventListener("click", function(){
      var a_ = document.getElementById("arch"); a_.hidden = !a_.hidden;
      btn.textContent = "архив обновлений (" + older.length + ") " + (a_.hidden ? "▾" : "▴");
    });
    box.addEventListener("click", function(e){
      var c = e.target.closest(".chip"); if(!c) return;
      var i = bySlug[c.getAttribute("data-slug")];
      if(i !== undefined) select(i, true);
    });
    render();
  }
  var bySlug = {};

  function src(s){
    if(LOCAL) return "audio?sid=" + encodeURIComponent(s.sid) + "&p=pb-audition";
    var v = s.versions && s.versions["pb-audition"];
    return R2 + "/" + s.slug + "/pb-audition.mp3" + (v ? "?v=" + v + "&" : "?") + "cors=1";
  }
  function fmt(t){ if(!isFinite(t) || t < 0) t = 0; t = Math.floor(t);
    return Math.floor(t / 60) + ":" + ("0" + t % 60).slice(-2); }
  function esc(x){ return String(x).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify({sid: songs[idx] && songs[idx].sid, t: a.currentTime || 0})); } catch(e){} }
  function load(){ try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ return null; } }

  function render(){
    list.innerHTML = songs.map(function(s, i){
      var u = fresh[s.slug] ? '<span class="u" title="обновлена в последнем обновлении">' + fresh[s.slug] + '</span>' : "";
      return '<li data-i="' + i + '"><span class="n">' + (i + 1) + '</span><span class="t"><b>' + esc(s.title)
        + '</b><span>' + esc(s.artist || "") + '</span></span>' + u + '<span class="d">' + (durs[i] ? fmt(durs[i]) : "") + '</span></li>';
    }).join("");
    mark();
  }
  function mark(){
    var lis = list.children;
    for(var i = 0; i < lis.length; i++) lis[i].classList.toggle("cur", i === idx);
  }

  function select(i, autoplay, startAt){
    if(i < 0 || i >= songs.length) return;
    idx = i; var s = songs[i];
    msg.textContent = "";
    a.src = src(s);
    if(startAt) a.addEventListener("loadedmetadata", function f(){ a.removeEventListener("loadedmetadata", f);
      try { a.currentTime = startAt; } catch(e){} });
    document.getElementById("nowTitle").textContent = (i + 1) + ". " + s.title;
    document.getElementById("nowArtist").textContent = s.artist || "";
    document.title = s.title + " · pb audition";
    mark(); meta(s); save();
    var li = list.children[i]; if(autoplay && li && li.scrollIntoView) li.scrollIntoView({block: "center"});
    if(autoplay) play();
  }
  function play(){
    wantPlay = true;
    try { if(navigator.audioSession) navigator.audioSession.type = "playback"; } catch(e){}
    var p = a.play(); if(p && p.catch) p.catch(function(e){ if(e && e.name !== "AbortError") msg.textContent = "нажми ▶"; });
  }
  function next(auto){
    if(idx + 1 < songs.length) select(idx + 1, true);
    else if(auto){ wantPlay = false; select(0, false); }   // end of the set: back to the top, stopped
  }
  function prev(){
    if(a.currentTime > 3 || idx <= 0) { a.currentTime = 0; if(a.paused) play(); }
    else select(idx - 1, true);
  }

  function meta(s){
    if(!("mediaSession" in navigator)) return;
    try { navigator.mediaSession.metadata = new MediaMetadata({title: s.title,
      artist: (s.artist ? s.artist + " · " : "") + "pb audition", album: "Cherry Daddies · 12.12"}); } catch(e){}
  }
  if("mediaSession" in navigator){
    var h = {
      play: function(){ play(); }, pause: function(){ wantPlay = false; a.pause(); },
      nexttrack: function(){ next(false); }, previoustrack: function(){ prev(); },
      seekto: function(d){ if(d && isFinite(d.seekTime)) a.currentTime = d.seekTime; }
    };
    Object.keys(h).forEach(function(k){ try { navigator.mediaSession.setActionHandler(k, h[k]); } catch(e){} });
  }
  function position(){
    if(!("mediaSession" in navigator) || !navigator.mediaSession.setPositionState) return;
    if(!isFinite(a.duration) || a.duration <= 0) return;
    try { navigator.mediaSession.setPositionState({duration: a.duration, playbackRate: a.playbackRate || 1,
      position: Math.min(a.currentTime, a.duration)}); } catch(e){}
  }

  a.addEventListener("ended", function(){ next(true); });
  a.addEventListener("error", function(){
    if(idx < 0 || !a.getAttribute("src")) return;
    var li = list.children[idx]; if(li) li.classList.add("bad");
    if(!wantPlay){ msg.textContent = "не загрузилась: " + songs[idx].title; return; }
    msg.textContent = "не загрузилась: " + songs[idx].title + " — дальше";
    next(true);
  });
  a.addEventListener("play", function(){ playBtn.textContent = "⏸"; });
  a.addEventListener("pause", function(){ playBtn.textContent = "▶"; save(); });
  var wantPlay = false;
  a.addEventListener("loadedmetadata", function(){
    document.getElementById("dur").textContent = fmt(a.duration);
    durs[idx] = a.duration; var li = list.children[idx];
    if(li) li.querySelector(".d").textContent = fmt(a.duration);
    position();
  });
  var lastSave = 0;
  a.addEventListener("timeupdate", function(){
    document.getElementById("cur").textContent = fmt(a.currentTime);
    if(!dragging && a.duration) seek.value = Math.round(a.currentTime / a.duration * 1000);
    var now = Date.now(); if(now - lastSave > 5000){ lastSave = now; save(); position(); }
  });
  seek.addEventListener("input", function(){ dragging = true;
    if(a.duration) document.getElementById("cur").textContent = fmt(seek.value / 1000 * a.duration); });
  seek.addEventListener("change", function(){ dragging = false;
    if(a.duration) a.currentTime = seek.value / 1000 * a.duration; });

  playBtn.addEventListener("click", function(){
    if(idx < 0) select(0, true);
    else if(a.paused) play(); else { wantPlay = false; a.pause(); }
  });
  document.getElementById("next").addEventListener("click", function(){ next(false); });
  document.getElementById("prev").addEventListener("click", prev);
  list.addEventListener("click", function(e){
    var li = e.target.closest("li"); if(!li) return;
    var i = +li.getAttribute("data-i");
    if(i === idx){ if(a.paused) play(); else { wantPlay = false; a.pause(); } }
    else select(i, true);
  });

  fetch("songs.json", {cache: "no-store", credentials: "same-origin"}).then(function(r){
    if(!r.ok) throw new Error(r.status); return r.json();
  }).then(function(d){
    var set = (d.sets || []).filter(function(x){ return x.name === SET; })[0];
    if(!set) throw new Error("нет сета " + SET);
    songs = set.songs.filter(function(s){ return s.audition && s.hasData; });
    var skipped = set.songs.length - songs.length;
    document.getElementById("sub").textContent = songs.length + " песен подряд · "
      + (set.subtitle || "") + (skipped ? " · без pb audition: " + skipped : "")
      + " · играет и при заблокированном экране";
    songs.forEach(function(s, i){ bySlug[s.slug] = i; });
    render();
    fetch("audition-updates.json", {cache: "no-store", credentials: "same-origin"})
      .then(function(r){ return r.ok ? r.json() : null; }).then(showUpdates).catch(function(){});
    var st = load(), at = 0;
    if(st && st.sid) songs.forEach(function(s, i){ if(s.sid === st.sid) at = i; });
    select(at, false, st && st.t > 5 ? st.t : 0);
  }).catch(function(e){
    document.getElementById("sub").textContent = "не удалось загрузить songs.json (" + e.message + ")";
  });
})();
</script>
</body>
</html>
